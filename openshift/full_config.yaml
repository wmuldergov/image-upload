# To deploy
# 1. Replace the two instances of <NAMESPACE> with the namespace you are deploying this too (ie abc123-dev)
# 2. In OpenShift go to the namespace and click the + in the top bar to add a YAML file. Copy and paste this entire file and click create.
# 3. Run the Github action to deploy the image to the ImageStream which should automatically cause the app to start.

kind: ImageStream
apiVersion: image.openshift.io/v1
metadata:
  name: image-upload
  labels:
    app: image-upload
spec:
  lookupPolicy:
    local: false

---

kind: Deployment
apiVersion: apps/v1
metadata:
  annotations:
    image.openshift.io/triggers: '[{"from":{"kind":"ImageStreamTag","name":"image-upload:latest","namespace":"<NAMESPACE>"},"fieldPath":"spec.template.spec.containers[?(@.name==\"container\")].image","pause":"false"}]'
  name: image-upload
  labels:
    app: image-upload
spec:
  replicas: 1
  selector:
    matchLabels:
      app: image-upload
  template:
    metadata:
      creationTimestamp: null
      labels:
        app: image-upload
    spec:
      containers:
        - name: container
          image: 'image-registry.openshift-image-registry.svc:5000/<NAMESPACE>/image-upload@latest'
          ports:
            - containerPort: 5000
              protocol: TCP
          env:
            - name: USERNAME
              value: username
            - name: PASSWORD
              value: password
          resources:
            requests:
              cpu: 5m
              memory: 128Mi
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
          imagePullPolicy: IfNotPresent
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
      dnsPolicy: ClusterFirst
      securityContext: {}
      schedulerName: default-scheduler
  strategy:
    type: Recreate
  revisionHistoryLimit: 10
  progressDeadlineSeconds: 600

---

kind: NetworkPolicy
apiVersion: networking.k8s.io/v1
metadata:
  name: image-upload
  labels:
    app: image-upload
spec:
  podSelector:
    matchLabels:
      app: image-upload
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              network.openshift.io/policy-group: ingress
  policyTypes:
    - Ingress

---

kind: Service
apiVersion: v1
metadata:
  name: image-upload
  labels:
    app: image-upload
spec:
  ports:
    - protocol: TCP
      port: 80
      targetPort: 5000
  selector:
    app: image-upload

---

kind: Route
apiVersion: route.openshift.io/v1
metadata:
  name: image-upload
  annotations:
    haproxy.router.openshift.io/ip_whitelist: 142.34.53.0/24 142.22.0.0/15 142.24.0.0/13 142.32.0.0/13
  labels:
    app: image-upload
spec:
  host: 
  path: /
  to:
    kind: Service
    name: image-upload
    weight: 100
  port:
    targetPort: 8501
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  wildcardPolicy: None